<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking.com Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <section id="view-status" class="view" hidden>
      <header>
        <h1>Booking sync</h1>
        <div class="header-actions">
          <p id="status" class="status status-error" hidden>Error</p>
          <button
            id="needs-details-badge"
            type="button"
            class="needs-badge"
            hidden
            aria-label="Open inbox — bookings needing details"
            title="Open inbox — bookings needing details"
          >
            <span class="needs-badge-icon" aria-hidden="true">⚠</span>
            <span id="needs-details-count" class="needs-badge-count">0</span>
          </button>
          <button
            id="open-saas"
            type="button"
            class="icon-btn"
            aria-label="Open reception"
            title="Open reception"
          >
            ⌂
          </button>
          <button id="open-settings" type="button" class="icon-btn" aria-label="Settings" title="Settings">
            ⚙
          </button>
        </div>
      </header>

      <p id="page-context" class="meta">Checking current tab…</p>

      <div class="panel">
        <p class="panel-label">Scan arrivals</p>
        <div class="chips" role="group" aria-label="Arrival date range">
          <button type="button" class="chip is-active" data-range="today" id="range-today">
            Today
          </button>
          <button type="button" class="chip" data-range="week" id="range-week">Week</button>
          <button type="button" class="chip" data-range="month" id="range-month">Month</button>
        </div>
        <div class="date-row">
          <label class="date-field">
            <span>From</span>
            <input id="date-from" type="date" />
          </label>
          <label class="date-field">
            <span>To</span>
            <input id="date-to" type="date" />
          </label>
        </div>
      </div>

      <div class="panel panel-soft">
        <p class="panel-label">Freshness</p>
        <p id="freshness" class="freshness" hidden>No list scan yet</p>
        <p id="freshness-nudge" class="meta freshness-nudge" hidden></p>
        <p id="last-sync" class="meta last-sync">No list scan yet</p>
      </div>

      <p id="error" class="error" hidden></p>

      <div class="actions">
        <button id="primary-action" type="button">Open reservations list</button>
        <button id="secondary-action" type="button" class="secondary" hidden>
          Sync this list anyway
        </button>
      </div>
    </section>

    <section id="view-settings" class="view" hidden>
      <header>
        <h1>Settings</h1>
        <button id="back-status" type="button" class="icon-btn" aria-label="Back" title="Back">←</button>
      </header>

      <p id="settings-hint" class="meta">
        Set webhook and sync secret once. Reception inbox uses Booking.com hotel ID from Admin /
        Owner settings.
      </p>
      <p id="settings-error" class="error" hidden></p>

      <label class="field">
        <span>Webhook URL</span>
        <input id="webhook-url" type="url" autocomplete="off" />
      </label>
      <label class="field">
        <span>Sync secret</span>
        <input id="sync-secret" type="password" autocomplete="off" />
      </label>
      <label class="field">
        <span>Open reception URL</span>
        <input id="saas-url" type="url" autocomplete="off" />
      </label>

      <div class="actions">
        <button id="save" type="button">Save</button>
      </div>
    </section>

    <script src="popup.js" type="module"></script>
  </body>
</html>
